<div class="fixed inset-0 bg-opacity-40 flex items-center justify-center z-50">
  <div
    class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-2xl relative animate-fadeIn"
  >
    <button
      class="absolute top-4 right-4 text-gray-400 pointer hover:text-gray-700 transition"
    >
      ✕
    </button>
    <h2 class="text-2xl font-semibold flex text-gray-800 mb-6 text-center">
      question
      <p class="ms-2 me-2">{{ (currentQuestion$ | async)?.index }}</p>
      of
      <p class="ms-3">{{ numOfQuestion }}</p>
    </h2>

    <div class="quiz-progress">
      @for (item of questionProgressArray(); track $index) { @if ($index <=
      currentQuestion.index ) {
      <div class="quiz-step answered"></div>
      } @else {
      <div class="quiz-step"></div>
      } }
    </div>

    <div class="text-gray-700 text-lg mb-6 text-center">
      {{ currentQuestion.question }}
    </div>

    <div class="space-y-4">
      @for(answerObj of currentQuestion.answers; track $index){
      <div
        class="p-4 border rounded-xl hover:bg-gray-50 transition cursor-pointer flex items-center gap-3"
      >
        <input
          (change)="onSelectAnswer()"
          type="radio"
          [(ngModel)]="selectAnswer"
          [value]="answerObj.key"
          [id]="answerObj.key"
          [name]="currentQuestion._id"
        />
        <label for="">{{ answerObj.answer }}</label>
      </div>
      }
    </div>

    <div class="mt-8 flex justify-between">
      <button
        [disabled]="isBackBtnDisabled"
        (click)="onBack()"
        [class]="
          'px-5 py-2 rounded-lg font-medium transition ' +
          (isBackBtnDisabled
            ? 'bg-gray-100 hover:bg-gray-200 cursor-not-allowed opacity-50 text-white'
            : 'bg-amber-600 hover:bg-amber-700   text-gray-700 cursor-pointer')
        "
      >
        ← Back
      </button>

      <button
        (click)="onExam()"
        [disabled]="isNextBtnDisabled"
        [class]="
          'px-5 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg text-gray-600 font-medium ' +
          (isNextBtnDisabled
            ? 'bg-gray-200 text-gray-500 cursor-not-allowed opacity-50 '
            : 'bg-blue-500 hover:bg-blue-600 text-white cursor-pointer')
        "
      >
        Next →
      </button>
    </div>
  </div>
</div>
