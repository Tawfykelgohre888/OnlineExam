<div class="flex flex-col gap-2">
  @if (label()) {
    <label class="block text-left text-lg font-bold text-gray-700">
      {{ label() }}
      @if (required()) {
        <span class="text-red-500">*</span>
      }
    </label>
  }

  <div class="relative">
    <input
      [placeholder]="placeholder()"
      [required]="required()"
      [type]="currentType()"
      [value]="value()"
      [disabled]="isDisabled()"
      (input)="onInputChange($event)"
      (blur)="onTouched()"
      class="w-full rounded-lg border border-gray-300 px-4 py-2 outline-none transition-all focus:border-blue-600 disabled:bg-gray-100 disabled:cursor-not-allowed"
    />

    @if (isPassword()) {
      <button
        type="button"
        (click)="togglePassword()"
        class="absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer text-gray-500 hover:text-blue-600 transition-colors focus:outline-none"
      >
        @if (showPassword()) {
          <i class="pi pi-eye"></i>
        } @else {
          <i class="pi pi-eye-slash"></i>
        }
      </button>
    }
  </div>
</div>
