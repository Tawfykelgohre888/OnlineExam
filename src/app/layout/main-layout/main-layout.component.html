<div class="relative flex items-center justify-center px-4 pt-3">
  <form class="w-full max-w-2xl">
    <label for="default-search" class="mb-2 text-sm font-medium sr-only"
      >Search</label
    >
    <div class="relative">
      <div
        class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none"
      >
        <i class="pi pi-search" style="font-size: 1rem"></i>
      </div>
      <input
        type="search"
        id="default-search"
        class="block w-full p-4 ps-10 text-sm text-gray-900 border border-gray-300 rounded-lg bg-white focus:ring-blue-500 focus:border-blue-500 dark:focus:ring-blue-500 dark:focus:border-blue-500"
        placeholder="Search Quiz"
        required
      />
    </div>
  </form>
</div>

<aside
  id="logo-sidebar"
  class="fixed top-0 left-0 z-40 w-64 h-screen transition-transform -translate-x-full sm:translate-x-0"
  aria-label="Sidebar"
>
  <div class="h-full px-3 py-4 overflow-y-auto bg-gray-50">
    <a class="flex items-center ps-2.5 mb-5">
      <span
        class="self-center text-xl font-semibold whitespace-nowrap dark:text-black"
        >ElGohre Tech ⭐⭐⭐</span
      >
    </a>
    <ul class="space-y-2 font-medium">
      <li>
        <a
          href="#"
          class="flex items-center p-2 text-gray-900 rounded-lg bg-blue-700 dark:text-gray dark:hover:bg-blue-700"
          routerLink="/mainLayout/dashboard"
        >
          <i class="pi pi-home text-white"></i>

          <span class="ms-3 text-white">Dashboard</span>
        </a>
      </li>
      <li>
        <a href="#" class="flex items-center p-2 text-gray-900 rounded-lg">
          <div class="p-1 bg-blue-600 flex items-center justify-center rounded">
            <i class="pi pi-sync text-white"></i>
          </div>

          <span class="flex-1 ms-10 whitespace-nowrap">Quiz History</span>
        </a>
      </li>
      <li>
        <button
          type="button"
          (click)="logout()"
          class="w-full flex items-center p-2 text-gray-900 rounded-lg hover:bg-gray-100 transition-colors"
        >
          <div class="p-1 bg-blue-600 flex items-center justify-center rounded">
            <i class="pi pi-arrow-left text-white"></i>
          </div>

          <span class="flex-1 ms-10 text-left">Log Out</span>
        </button>
      </li>

      <li>
        <button
          type="button"
          (click)="visible = true"
          class="w-full flex items-center p-2 text-red-500 rounded-lg hover:bg-red-50 transition-colors"
        >
          <div class="p-1 bg-red-500 flex items-center justify-center rounded">
            <i class="pi pi-trash text-white"></i>
          </div>

          <span class="flex-1 ms-10 text-left">Delete My Account</span>
        </button>
      </li>
    </ul>
  </div>
</aside>

<router-outlet />

<div class="flex justify-center">
  <p-dialog
    [(visible)]="visible"
    [modal]="true"
    [closable]="false"
    header="Delete Account"
    [style]="{ width: '32rem' }"
  >
    <div class="flex flex-col gap-5">
      <div class="flex items-center gap-3">
        <i class="pi pi-exclamation-triangle text-red-500 text-3xl"></i>

        <div>
          <h3 class="font-semibold text-lg">Are you sure?</h3>
          <p class="text-gray-500 text-sm mt-1">
            This action is permanent and cannot be undone. Your account and all
            quiz history will be permanently deleted.
          </p>
        </div>
      </div>

      <div class="flex justify-end gap-3">
        <button
          type="button"
          pButton
          label="Cancel"
          severity="secondary"
          (click)="visible = false"
        ></button>

        <button
          type="button"
          pButton
          label="Delete Account"
          severity="danger"
          (click)="deleteMyAccount(); visible = false"
        ></button>
      </div>
    </div>
  </p-dialog>
</div>
