<div class="p-12 sm:ml-64 shadow-md">
  <app-page-header
    [title]="'Account Settings'"
    [subtitle]="'Manage your account information'"
    [icon]="'pi pi-user text-white '"
  />

  <div class="grid grid-cols-12 gap-5 mt-4">
    <div class="text-white col-span-3 rounded-md bg-white shadow p-4">
      <div
        [routerLink]="'/mainLayout/accountSettings'"
        [routerLinkActive]="'bg-blue-200 text-blue-500'"
        class="flex items-center gap-2 px-4 py-3 cursor-pointer mb-5"
      >
        <div
          class="w-10 h-10 rounded-full bg-gray-500 flex items-center justify-center"
        >
          <i class="pi pi-user" style="font-size: 1.5rem"></i>
        </div>
        <p class="text-[#155DFC] font-normal text-base">Profile</p>
      </div>
      <div
        [routerLink]="'/mainLayout/changePassword'"
        [routerLinkActive]="'bg-blue-200 text-blue-500'"
        class="flex items-center gap-2 px-4 py-3 cursor-pointer"
      >
        <div
          class="w-10 h-10 rounded-full bg-gray-500 flex items-center justify-center"
        >
          <i class="pi pi-lock" style="font-size: 1.5rem"></i>
        </div>
        <p class="text-[#155DFC] font-normal text-base">Change Password</p>
      </div>

      <button
        class="flex items-center gap-2 p-5 w-full mt-50 cursor-pointer bg-[#FEF2F2] text-[#DC2626] font-normal text-base"
      >
        <i class="pi pi-sign-out bottom-0"></i> <span>Logout</span>
      </button>
    </div>
    <div class="content col-span-9">
      <router-outlet />
    </div>
  </div>
</div>
