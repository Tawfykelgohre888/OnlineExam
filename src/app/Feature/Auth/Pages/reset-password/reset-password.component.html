<div class="">
  <h2 class="font-bold text-3xl">Create a New Password</h2>
  <p class="text[#6B7280] text-lg font-normal">
    Create a new strong password for your account.
  </p>
  <div class="flex flex-col mt-2 p-2">
    <form
      class="flex flex-col mt-2 p-2"
      [formGroup]="resetForm"
      (ngSubmit)="resetPassword()"
    >
      <label class="text-base font-medium" for="Password"> Password </label>

      <input
        id="Password"
        type="password"
        placeholder="********"
        pInputText
        formControlName="newPassword"
      />
      <label class="text-base font-medium" for="Confirm New Password">
        Confirm New Password
      </label>

      <input
        id="Confirm New Password"
        type="password"
        placeholder="********"
        pInputText
        formControlName="confirmPassword"
      />
      <button type="submit" class="bg-blue-600 mt-2 p-3 w-full text-white">
        Reset Password
      </button>
    </form>
  </div>
</div>
