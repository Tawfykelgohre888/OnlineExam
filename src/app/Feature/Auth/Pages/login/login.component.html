<div class="content flex flex-col items-center justify-center">
  <div
    class="inputs mt-5 p-10 text-center w-[550px] h-[490px] flex flex-col items-center justify-center"
  >
    <h6 class="mb-4 self-start font-bold text-4xl">Login</h6>
    <form
      [formGroup]="loginForm"
      (ngSubmit)="LoginPost()"
      class="w-full flex flex-col gap-3"
    >
      <div class="email relative">
        <app-input
          [type]="'text'"
          [label]="'Username'"
          [placeholder]="'Enter your username'"
          [required]="true"
          formControlName="username"
        ></app-input>
      </div>
      <div class="relative">
        <app-input
          [label]="'Password'"
          [type]="'password'"
          [placeholder]="'Enter The Password'"
          [required]="true"
          [isPassword]="true"
          formControlName="password"
        />
      </div>
      <div class="w-full flex justify-end">
        <a
          class="no-underline text-blue-600 text-lg hover:text-blue-800 hover:underline cursor-pointer transition-all duration-300 font-semibold"
          routerLink="/forgetPassword"
          >Forgot your password?</a
        >
      </div>
      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="bg-blue-600 text-white rounded p-3 cursor-pointer disabled:bg-blue-100 disabled:text-blue-400 disabled:cursor-not-allowed"
      >
        Login
      </button>
    </form>
    <p class="mt-4 text-lg">
      Don’t have an account?
      <button
        routerLink="/register"
        class="text-blue-600 hover:text-blue-800 hover:underline cursor-pointer transition-all duration-300 font-semibold"
      >
        Create yours
      </button>
    </p>
  </div>
</div>
