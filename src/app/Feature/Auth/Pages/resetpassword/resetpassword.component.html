<div class="flex flex-col items-center justify-center min-h-screen">
  <!-- Card -->
  <div
    class="bg-white shadow-lg rounded-2xl w-[410px] h-[490px] flex flex-col items-center p-6 text-center"
  >
    <h6 class="mb-4 w-full text-left font-bold text-gray-800">
      Set a Password
    </h6>

    <form class="w-full flex flex-col gap-4">
      <!-- Create Password -->
      <div class="relative">
        <app-input
          label="Create Password"
          [type]="'password'"
          [placeholder]="'Create Password'"
          formControlName="newPassword"
        ></app-input>
      </div>

      <!-- Confirm Password -->
      <div class="relative">
        <app-input
          label="Re-enter Password"
          [type]="'password'"
          [placeholder]="'confirmPassword'"
          formControlName="confirmPassword"
          s
        ></app-input>
      </div>

      <!-- Resend -->
      <div class="flex justify-end">
        <a
          href="#"
          class="text-sm text-gray-500 hover:text-gray-700 transition"
        >
          Didn’t receive a code? Resend
        </a>
      </div>

      <!-- Button -->
      <button
        type="submit"
        class="w-full bg-blue-600 text-white rounded-lg py-2 font-medium hover:bg-blue-700 transition"
      >
        Set Password
      </button>
    </form>
  </div>
</div>
