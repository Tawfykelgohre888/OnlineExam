<div class="content flex flex-col items-center justify-center">
  <div
    class="inputs flex flex-col justify-center items-center mt-5 p-5 text-center rounded bg-white shadow-md"
    style="width: 410px; height: 490px"
  >
    <form
      [formGroup]="emailForm"
      (ngSubmit)="FORGETPASSWORD()"
      class="w-full flex flex-col gap-3"
    >
      <div class="mb-5">
        <app-input
          [label]="'Forgot your password?'"
          [placeholder]="'user@example.com'"
          [required]="true"
          formControlName="email"
        >
        </app-input>
      </div>

      <button
        [disabled]="emailForm.invalid"
        type="submit"
        class="bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition disabled:bg-blue-100 disabled:text-blue-400 disabled:cursor-not-allowed"
      >
        Next
      </button>
    </form>
    <p>
      Already have an account?
      <a
        routerLink="/login"
        class="text-blue-600 hover:text-blue-800 hover:underline cursor-pointer transition-all duration-300 font-semibold"
        >Login</a
      >
    </p>
  </div>
</div>
