<div class="content flex flex-col items-center justify-center">
  <div
    class="inputs flex flex-col items-center justify-center mt-15 p-5 text-center rounded bg-white shadow-md"
    style="width: 410px; height: 490px"
  >
    <div class="header">
      <app-navbar />
    </div>
    <h3 class="mb-4 w-full text-left text-2xl font-bold">Sign up</h3>

    <form
      [formGroup]="registerForm"
      class="w-full flex flex-col gap-3"
      (ngSubmit)="submitRegisterForm()"
    >
      <div>
        <app-input
          [label]="'User Name'"
          [placeholder]="'Enter Your User NAME'"
          [type]="'text'"
          [required]="false"
          formControlName="username"
        ></app-input>
      </div>
      <div>
        <app-input
          [label]="'First Name'"
          [type]="'text'"
          [placeholder]="'Inter Your The First Name'"
          [required]="true"
          formControlName="firstName"
        ></app-input>
      </div>
      <div>
        <app-input
          [label]="'Last Name'"
          [type]="'text'"
          [placeholder]="'Inter Your The Last Name'"
          [required]="true"
          formControlName="lastName"
        ></app-input>
      </div>
      <div>
        <app-input
          [label]="'Email'"
          [type]="'email'"
          [placeholder]="'Inter Your The Email'"
          [required]="true"
          formControlName="email"
        ></app-input>
      </div>
      <div class="relative">
        <app-input
          [label]="'Password'"
          [type]="'password'"
          [placeholder]="'Inter Your The Password'"
          [required]="true"
          [isPassword]="true"
          formControlName="password"
        ></app-input>
      </div>
      <div class="relative">
        <app-input
          [label]="'RePassword'"
          [type]="'password'"
          [placeholder]="'Inter Your The RePassword'"
          [required]="true"
          [isPassword]="true"
          formControlName="rePassword"
        ></app-input>
      </div>
      <div>
        <app-input
          [label]="'Phone'"
          [type]="'tel'"
          [placeholder]="'Inter Your The Phone'"
          [required]="true"
          formControlName="phone"
        ></app-input>
      </div>
      <div class="text-sm text-gray-500">
        <a class="no-underline text-black" routerLink="/login"
          >Already have an account? Login</a
        >
      </div>
      <button
        type="submit"
        class="bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition"
      >
        Create Account
      </button>
    </form>

    <app-footer></app-footer>
  </div>
</div>
