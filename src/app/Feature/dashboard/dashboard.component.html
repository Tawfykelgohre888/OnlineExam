<div class="p-4 sm:ml-64">
  <div class="p-4 border-2 border-gray-200 border-dashed rounded-lg bg-white">
    <!-- Header -->
    <app-page-header
      [title]="'Dashboard'"
      [subtitle]="'Welcome to your dashboard'"
      [icon]="'pi pi-graduation-cap text-white '"
    />
    <!-- Responsive Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 p-5 gap-5">
      @for (subject of subjects; track subject.id) {
        <div
          class="group relative w-full border border-gray-200 shadow hover:shadow-lg transition-all duration-300"
        >
          <!-- Image -->
          <img
            class="w-full h-[570px] object-cover"
            [src]="subject.image"
            alt="{{ subject.title }}"
            [routerLink]="['/mainLayout/exams', subject.id]"
          />

          <!-- Overlay -->
          <div
            class="absolute inset-0 left-10 flex justify-center items-center pointer-events-none"
          >
            <div
              class="bg-[#1935CA]/70 text-center px-4 py-3 absolute transition top-92 start-0 bottom-0 w-[90%] h-50"
            >
              <p class="text-white text-lg font-bold">
                {{ subject.title }}
              </p>
              <p class="text-white text-sm">
                {{ subject.description }}
              </p>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</div>
