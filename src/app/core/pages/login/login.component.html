<div class="content flex flex-col items-center justify-center">
  <div class="header w-full">
    <app-navbar />
  </div>
  <div
    class="inputs mt-5 p-10 text-center w-[550px] h-[490px] flex flex-col items-center justify-center shadow"
  >
    <h6 class="mb-4 self-start font-bold text-2xl">Sign In</h6>
    <form
      [formGroup]="loginForm"
      (ngSubmit)="LoginPost()"
      class="w-full flex flex-col gap-3"
    >
      <div class="email relative">
        <app-input
          [type]="'email'"
          [label]="'Email'"
          [placeholder]="'Enter your email'"
          [required]="true"
          formControlName="email"
        ></app-input>
      </div>
      <div class="relative">
        <app-input
          [label]="'Password'"
          [type]="'password'"
          [placeholder]="'Enter The Password'"
          [required]="true"
          [isPassword]="true"
          formControlName="password"
        />
      </div>
      <div class="w-full flex justify-end">
        <a
          class="no-underline text-blue-600 text-sm"
          routerLink="/forgetPassword"
          >Recover password?</a
        >
      </div>
      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="bg-blue-600 text-white rounded px-4 py-2 cursor-pointer disabled:bg-blue-100 disabled:text-blue-400 disabled:cursor-not-allowed"
      >
        Login
      </button>
    </form>
    <app-footer />
  </div>
</div>
