<div class="content flex flex-col items-center justify-center">
  <div class="header">
    <app-navbar />
  </div>

  <div
    class="inputs flex flex-col justify-center items-center mt-5 p-5 text-center rounded bg-white shadow-md"
    style="width: 410px; height: 490px"
  >
    <form
      [formGroup]="emailForm"
      (ngSubmit)="FORGETPASSWORD()"
      class="w-full flex flex-col gap-3"
    >
      <div class="mb-5">
        <app-input
          [label]="'Forgot your password?'"
          [placeholder]="'Enter Your Mail'"
          [required]="true"
          formControlName="email"
        >
        </app-input>
      </div>

      <button
        type="submit"
        class="bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition"
      >
        Sign in
      </button>
    </form>

    <app-footer />
  </div>
</div>
